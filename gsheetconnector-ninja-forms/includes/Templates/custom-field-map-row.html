<script>
  jQuery(function ($) {
    function lockSortingToggle() {
      $("#sheet_sorting_enable").prop("checked", true).prop("disabled", true);

      $(
        "#sheet_sorting_column, #sheet_sorting_order, #auto_sheet_names, #auto_sheet_tab_names_drop",
      ).prop("disabled", true);
    }

    lockSortingToggle();

    new MutationObserver(lockSortingToggle).observe(document.body, {
      childList: true,
      subtree: true,
    });
  });

  /* disabled toggle in ninja inner forms*/
  jQuery(function ($) {
    var ids = [
      "gscnjf_sheet_sorting_enable",
      "gscnjf_conditional_logic_enable",
      "gscnjf_freeze_header",
      "gscnjf_color_settings",
      "gscnjf_header_appearance_settings",
      "gscnjf_row_appearance_settings",

      // Select dropdowns
      "gscnjf_sheet_sorting_column",
      "gscnjf_sheet_sorting_order",
      "gscnjf_conditional_logic_match_type",
      "gscnjf_header_font_style",
      "gscnjf_header_font_size",
      "gscnjf_row_font_style",
      "gscnjf_row_font_size",
      "gscnjf_auto_sheet_names",
      "gscnjf_auto_sheet_tab_names_drop",
    ];

    // Color picker settings (WordPress wpColorPicker wraps the input)
    var colorIds = [
      "gscnjf_header_color_njf",
      "gscnjf_odd_color_njf",
      "gscnjf_even_color_njf",
      "gscnjf_header_font_color",
      "gscnjf_row_font_color",
    ];

    function lockColors() {
      $.each(colorIds, function (i, id) {
        var $input = $("#" + id);
        if (!$input.length) {
          return;
        }

        // Runs every pass (no "already locked" gate) because the picker
        // wrapper/button can be built after the input is rendered.
        $input.prop("disabled", true).attr("aria-disabled", "true");

        var $wrap = $input.closest(".wp-picker-container");
        $wrap.addClass("gscnjf-color-disabled");

        // Keep the swatch showing the saved color (e.g. #ffffff).
        // Don't use the "disabled" attribute on the swatch: it drops its color styling.
        // Clicks are blocked with CSS (pointer-events) + tabindex for the keyboard.
        $wrap
          .find(".wp-color-result")
          .css("background-color", $input.val() || "#ffffff")
          .attr({ "aria-disabled": "true", tabindex: "-1" });

        $wrap
          .find(".wp-picker-clear, .wp-picker-default")
          .prop("disabled", true)
          .attr("aria-disabled", "true");
      });
    }

    function lockToggles() {
      $.each(ids, function (i, id) {
        var $input = $("#" + id);

        // Not rendered yet, or already locked.
        if (!$input.length || $input.data("gscnjfLocked")) {
          return;
        }

        $input
          .prop("disabled", true)
          .attr("aria-disabled", "true")
          .data("gscnjfLocked", true);

        $('label[for="' + id + '"]').addClass("gscnjf-disabled");
        $input.closest(".nf-setting").addClass("gscnjf-setting-disabled");
      });

      lockColors();
    }

    // Run once, then again whenever the builder re-renders settings (Backbone).
    var timer;
    function scheduleLock() {
      clearTimeout(timer);
      timer = setTimeout(lockToggles, 50);
    }

    lockToggles();
    new MutationObserver(scheduleLock).observe(document.body, {
      childList: true,
      subtree: true,
    });
  });

  jQuery(document).ready(function (jQuery) {
    jQuery(function ($) {
      var fieldIds = [
        "field_map_ninja_gsname",
        "field_map_ninja_gsid",
        "field_map_ninja_gstabname",
        "field_map_ninja_gstabid",
      ];

      var selector = fieldIds
        .map(function (id) {
          return "#" + id;
        })
        .join(",");

      function toggleSheetButtons() {
        var allFilled = fieldIds.every(function (id) {
          return $.trim($("#" + id).val() || "") !== "";
        });

        if (allFilled) {
          $(".google_sheet_link, .google_sheet_download").show();
        } else {
          $(".google_sheet_link, .google_sheet_download").hide();
        }
      }

      // fires while typing, pasting, or changing any of the 4 fields
      // (delegated, so it works even if the builder re-renders the fields)
      $(document).on("input keyup change paste", selector, function () {
        setTimeout(toggleSheetButtons, 0);
      });

      // initial check on page load
      toggleSheetButtons();

      // re-check when the action drawer is opened (Ninja Forms builder re-renders it)
      $(document).on(
        "click",
        ".nf-action-item, .nf-add-new-action",
        function () {
          setTimeout(toggleSheetButtons, 400);
        },
      );
    });
  });
</script>
